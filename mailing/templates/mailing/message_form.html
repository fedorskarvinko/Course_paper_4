<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{{ title }}</title>
    <style>
        body { font-family: Arial; max-width: 600px; margin: 40px auto; padding: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        .form-control { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; }
        textarea.form-control { min-height: 150px; resize: vertical; }
        .btn { padding: 10px 15px; background: #4CAF50; color: white; border: none; border-radius: 4px; cursor: pointer; }
        .btn-secondary { background: #757575; }
    </style>
</head>
<body>
<h1>{{ title }}</h1>

<form method="post">
    {% csrf_token %}

    <div class="form-group">
        <label for="{{ form.subject.id_for_label }}">Тема письма:</label>
        {{ form.subject }}
        {% if form.subject.errors %}
        <div style="color: #f44336;">{{ form.subject.errors }}</div>
        {% endif %}
    </div>

    <div class="form-group">
        <label for="{{ form.body.id_for_label }}">Текст письма:</label>
        {{ form.body }}
        {% if form.body.errors %}
        <div style="color: #f44336;">{{ form.body.errors }}</div>
        {% endif %}
    </div>

    <div style="margin-top: 20px;">
        <button type="submit" class="btn">Сохранить сообщение</button>
        <a href="{% url 'mailing:message_list' %}" class="btn btn-secondary">Отмена</a>
    </div>
</form>

<div style="margin-top: 20px;">
    <a href="{% url 'mailing:home' %}">← На главную</a> |
    <a href="{% url 'mailing:message_list' %}">📨 К списку сообщений</a>
</div>
</body>
</html>
