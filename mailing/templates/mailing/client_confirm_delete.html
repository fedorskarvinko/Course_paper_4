<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Удаление клиента</title>
    <style>
        body { font-family: Arial; max-width: 500px; margin: 40px auto; padding: 20px; }
        .warning { background: #ffebee; border-left: 4px solid #f44336; padding: 15px; margin: 20px 0; }
        .btn { padding: 10px 15px; margin-right: 10px; text-decoration: none; border-radius: 4px; border: none; cursor: pointer; }
        .btn-danger { background: #f44336; color: white; }
        .btn-secondary { background: #757575; color: white; }
    </style>
</head>
<body>
<h1>🗑️ Удаление клиента</h1>

<div class="warning">
    <strong>Внимание!</strong> Вы собираетесь удалить клиента:
    <strong>{{ client.full_name }}</strong> ({{ client.email }})
</div>

<p>Это действие нельзя отменить. Вы уверены?</p>

<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Да, удалить</button>
    <a href="{% url 'mailing:client_detail' client.pk %}" class="btn btn-secondary">Отмена</a>
</form>

<div style="margin-top: 20px;">
    <a href="{% url 'mailing:home' %}">← На главную</a>
</div>
</body>
</html>
